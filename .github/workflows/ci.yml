name: CI - Build

on:
    # pull_request:
    #     branches:
    #         - main
    fork
env:
    DOTNET_VERSION: '10.0.x'
    BUILD_CONFIGURATION: 'Release'

jobs:
    build:
        runs-on: ubuntu-latest
        
        steps:
            - name: Mensaje Inicial
              run: echo "Iniciando el workflow de CI"

            - name: Checkout de código
              uses: actions/checkout@v2

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                dotnet-version: ${{ env.DOTNET_VERSION }}

            - name: Verificar Versión .NET
              run: dotnet --version

            - name: Build del proyecto
              id: build-step
              run: dotnet build src/Api/Api.csproj --configuration ${{ env.BUILD_CONFIGURATION }}
              continue-on-error: true

            - name: Notiifica on build failure
              if: steps.build-step.outcome == 'failure'
              run: echo "Mamo el proyecto 😵‍💫"

            - name: Mensaje Final
              run: echo "Workflow de CI completado exitosamente"